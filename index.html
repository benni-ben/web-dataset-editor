<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataset Editor</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --entry: #2d2d2d;
            --border: #3e3e42;
            --text: #d4d4d4;
            --muted: #858585;
            --accent: #0e639c;
            --accent2: #4d2acb;
            --danger: #c72e2e;
            --dangerHover: #e74e4e;
            --ok: #2da042;
        }

        * { box-sizing: border-box; }

        body {
            font-family: monospace;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #fff;
            margin-top: 0;
        }

        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--panel);
            border: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-image: linear-gradient(90deg, var(--accent2) 11%, #071f45 100%);
            position: relative;
            overflow: hidden;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .danger-btn {
            background: var(--danger);
        }

        .danger-btn:hover {
            background: var(--dangerHover);
        }

        .ok-btn {
            background: var(--ok);
        }

        input[type="file"] {
            color: var(--text);
        }

        #editor-container {
            contain: content;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .entry {
            contain: layout paint;
            background: var(--entry);
            padding: 15px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .entry:hover {
            border-color: var(--accent);
        }

        .entry-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            grid-column: 1 / -1;
        }

        .entry-title {
            font-weight: bold;
            color: #fff;
        }

        .entry-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .messages {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            border: 1px solid #444;
            padding: 10px;
            background: #222;
        }

        .message-header {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .message-header label {
            margin: 0;
            display: inline-block;
        }

        select {
            background: #000;
            color: #d4d4d4;
            border: 1px solid #444;
            padding: 6px 8px;
            font-family: monospace;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: #000000;
            color: #96a9c2;
            padding: 8px;
            font-family: monospace;
            resize: vertical;
            overflow-y: auto;
            border: 1px solid #444;
        }

        textarea:focus, select:focus {
            outline: 1px solid var(--accent);
            color: #fff;
        }

        label {
            display: block;
            font-size: 0.85em;
            color: #dfdfdf;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #000;
            color: #d4d4d4;
            border: 1px solid #444;
            font-family: monospace;
        }

        .stats {
            margin-top: 10px;
            color: var(--muted);
        }

        .error {
            color: #f48771;
            font-weight: bold;
            display: none;
            margin-top: 8px;
        }

        .info-box {
            background: #333;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .small-btn {
            padding: 6px 10px;
            font-size: 0.9em;
        }

        .message-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .helper {
            color: #aaa;
            font-size: 0.9em;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Dataset Editor</h1>

    <div class="controls">
        <input type="file" id="fileInput" accept=".json,.jsonl,.txt">
        <div class="button-row">
            <button onclick="downloadData()" class="ok-btn">Download Fixed .jsonl</button>
            <button onclick="addNewEntry()" class="danger-btn">+ Add New Example</button>
        </div>
        <div class="helper">Each example can contain multiple messages. Use “Add Message” inside an entry to continue the conversation.<a class="helper" href="https://developers.openai.com/api/reference/resources/beta/subresources/threads/subresources/messages/methods/create" target="_blank">OpenAI Documentation</a></div>
        <div id="errorMsg" class="error"></div>
        <input class="search-box" id="searchInput" placeholder="Search examples..." oninput="searchExamples(this.value)">
        <div class="stats" id="stats">No file loaded. Please load a file in JSONL format, with a bracket-enclosed messages array.</div>
        <div class="info-box" id="logBox" style="display:none;"></div>
    </div>

    <div id="editor-container"></div>

    <script>
        let data = [];
        const STORAGE_KEY = "dataset";

        window.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    data = normalizeDataset(parsed);
                    render();
                    updateStats(data.length, data.length, 0, []);
                    console.log("Loaded from LocalStorage");
                } catch (e) {
                    console.error("Failed to load from LocalStorage", e);
                }
            }
        });

        let saveTimer;

        function saveToLocalStorage() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    document.getElementById('errorMsg').style.display = 'none';
                } catch (e) {
                    console.error('Failed to save LocalStorage', e);
                }
            }, 500);
        }

        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                const lines = content.split(/\r?\n/);

                let entries = [];
                let fixLog = [];
                let errors = 0;

                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.startsWith('//')) return;

                    try {
                        let fixedLine = trimmed
                            .replace(/"messages "\s*:/g, '"messages":')
                            .replace(/"role "\s*:/g, '"role":')
                            .replace(/"content "\s*:/g, '"content":')
                            .replace(/"prompt "\s*:/g, '"prompt":')
                            .replace(/"completion "\s*:/g, '"completion":');

                        if (trimmed !== fixedLine) {
                            fixLog.push(`Line ${index + 1}: Fixed key spacing`);
                        }

                        const obj = JSON.parse(fixedLine);
                        const normalized = normalizeOneEntry(obj);

                        if (normalized) {
                            entries.push(normalized);
                        } else {
                            errors++;
                            fixLog.push(`Line ${index + 1}: Skipped (unsupported structure)`);
                        }
                    } catch (err) {
                        errors++;
                        fixLog.push(`Line ${index + 1}: Skipped (Invalid JSON)`);
                    }
                });

                data = entries;
                render();
                updateStats(data.length, lines.length, errors, fixLog);
                saveToLocalStorage();
            };
            reader.readAsText(file);
        });

        function normalizeDataset(input) {
            if (!Array.isArray(input)) return [];
            return input.map(normalizeOneEntry).filter(Boolean);
        }

        function normalizeOneEntry(obj) {
            if (!obj || typeof obj !== 'object') return null;

            if (Array.isArray(obj.messages)) {
                const msgs = obj.messages
                    .filter(m => m && typeof m === 'object')
                    .map(m => ({
                        role: normalizeRole(m.role),
                        content: String(m.content ?? '')
                    }));
                if (msgs.length === 0) return null;
                return { messages: msgs };
            }

            if (typeof obj.prompt === 'string' || typeof obj.completion === 'string') {
                return {
                    messages: [
                        { role: 'user', content: String(obj.prompt ?? '') },
                        { role: 'assistant', content: String(obj.completion ?? '') }
                    ]
                };
            }

            return null;
        }

        function normalizeRole(role) {
            const r = String(role || '').toLowerCase().trim();
            if (r === 'assistant' || r === 'user' || r === 'system') return r;
            return 'user';
        }

        function updateStats(total, original, errors, logs) {
            const statsDiv = document.getElementById('stats');
            const logDiv = document.getElementById('logBox');

            statsDiv.innerText = `Loaded ${total} entries from ${original} lines.`;

            if (errors > 0 || logs.length > 0) {
                logDiv.style.display = 'block';
                let msg = `<strong>Processing Log:</strong>\n`;
                if (logs.filter(l => l.includes('Fixed')).length > 0) {
                    msg += `- Fixed spacing in some JSON keys.\n`;
                }
                if (errors > 0) {
                    msg += `- Skipped ${errors} invalid or unsupported lines.`;
                }
                logDiv.innerText = msg;
            } else {
                logDiv.style.display = 'none';
            }
        }

        let visibleLimit = 20;
        let searchQuery = "";

        function render() {
            const container = document.getElementById('editor-container');
            container.innerHTML = '';

            const filteredData = searchQuery
                ? data.filter(item => JSON.stringify(item).toLowerCase().includes(searchQuery.toLowerCase()))
                : data;

            filteredData.slice(0, visibleLimit).forEach((item) => {
                const index = data.indexOf(item);
                const entry = document.createElement('div');
                entry.className = 'entry';

                const head = document.createElement('div');
                head.className = 'entry-head';
                head.innerHTML = `
                    <div class="entry-title">Example ${index + 1} (${item.messages.length} messages)</div>
                    <div class="entry-actions">
                        <button class="small-btn" onclick="addMessage(${index})">+ Add Message</button>
                        <button class="small-btn danger-btn" onclick="deleteEntry(${index})">Delete Example</button>
                    </div>`;
                entry.appendChild(head);

                const messages = document.createElement('div');
                messages.className = 'messages';

                item.messages.forEach((msg, msgIndex) => {
                    const box = document.createElement('div');
                    box.className = 'message';
                    box.innerHTML = `
                        <div class="message-header">
                            <label>Role</label>
                            <select onchange="updateRole(${index}, ${msgIndex}, this.value)">
                                <option value="user" ${msg.role === 'user' ? 'selected' : ''}>user</option>
                                <option value="assistant" ${msg.role === 'assistant' ? 'selected' : ''}>assistant</option>
                                <option value="system" ${msg.role === 'system' ? 'selected' : ''}>system</option>
                            </select>
                            <button class="small-btn danger-btn" onclick="deleteMessage(${index}, ${msgIndex})">Delete Message</button>
                        </div>`;
                    const area = document.createElement('textarea');
                    area.value = msg.content;
                    area.oninput = () => updateMessageContent(index, msgIndex, area.value);
                    box.appendChild(area);
                    messages.appendChild(box);
                });

                entry.appendChild(messages);
                container.appendChild(entry);
            });

            if (data.length > visibleLimit) {
                const more = document.createElement('button');
                more.textContent = `Load more (${Math.min(20, data.length-visibleLimit)} examples)`;
                more.onclick = () => {
                    visibleLimit += 20;
                    render();
                };
                container.appendChild(more);
            }

            document.getElementById('stats').innerText =
                `Showing ${Math.min(visibleLimit, filteredData.length)} / ${filteredData.length} matching examples (${data.length} total) (Auto-saved locally)`;
        }

        function searchExamples(query) {
            searchQuery = query.trim();
            visibleLimit = 30;
            render();
        }

        function updateMessageContent(entryIndex, msgIndex, value) {
            if (!data[entryIndex] || !data[entryIndex].messages[msgIndex]) return;
            data[entryIndex].messages[msgIndex].content = value;
            saveToLocalStorage();
        }

        function updateRole(entryIndex, msgIndex, value) {
            if (!data[entryIndex] || !data[entryIndex].messages[msgIndex]) return;
            data[entryIndex].messages[msgIndex].role = normalizeRole(value);
            saveToLocalStorage();
        }

        function addMessage(entryIndex) {
            if (!data[entryIndex]) return;
            const messages = data[entryIndex].messages;
            const lastRole = messages.length ? messages[messages.length - 1].role : 'assistant';
            const nextRole = lastRole === 'user' ? 'assistant' : 'user';
            messages.push({ role: nextRole, content: nextRole === 'user' ? 'New user message' : 'New assistant message' });
            render();
            saveToLocalStorage();
        }

        function deleteMessage(entryIndex, msgIndex) {
            if (!data[entryIndex] || !data[entryIndex].messages[msgIndex]) return;
            if (confirm('Are you sure you want to delete this message?')) {
                data[entryIndex].messages.splice(msgIndex, 1);
                if (data[entryIndex].messages.length === 0) {
                    data.splice(entryIndex, 1);
                }
                render();
                saveToLocalStorage();
            }
        }

        function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this example?')) {
                data.splice(index, 1);
                render();
                saveToLocalStorage();
            }
        }

        function addNewEntry() {
            data.unshift({
                messages: [
                    { role: 'user', content: 'New Prompt' },
                    { role: 'assistant', content: 'New Answer' }
                ]
            });
            render();
            saveToLocalStorage();
            setTimeout(() => window.scrollTo(0, 0), 100);
        }

        function downloadData() {
            if (data.length === 0) {
                alert('No data to download!');
                return;
            }

            const jsonlContent = data.map(item => JSON.stringify({
                messages: item.messages.map(msg => ({
                    role: normalizeRole(msg.role),
                    content: String(msg.content ?? '')
                }))
            })).join('\n');

            const blob = new Blob([jsonlContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'fixed_dataset_messages.jsonl';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
